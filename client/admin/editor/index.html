<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Scanner</title>

    <link rel="icon" href="../../images/Hyu-favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="../../images/Hyu-favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <div class="header-wrapper">
                <div class="header-nav"><a href="../scanner/">Scanner</a></div>
                <div class="header-nav"><a href="../clients/">Clients</a></div>
                <div class="header-nav"><a href="../bookings/">Bookings</a></div>
                <div class="header-nav active">Editor</div>
            </div>
        </header>


        <div class="main-container">
            <div class="main-title">Editor</div>

            <div class="main-editor-wrapper">
                <div class="categories-main-container">
                    <div class="subtitle">Categories</div>

                    <div class="categories-wrapper">
                        <div class="category-block">
                            <div class="category-block-info">
                                <div class="category-name" id="appetizer">Appetizer</div>
                                <img src="../../images/edit-btn.svg" alt="" class="edit-btn edit-btn-category">
                            </div>
                            <div class="category-block-edit">
                                <label for="en-category">en</label>
                                <input type="text" id="en-category" name="en-category" value="Appetizer">

                                <label for="ru-category">ru</label>
                                <input type="text" id="ru-category" name="ru-category" value="Закуски">

                                <label for="ko-category">ko</label>
                                <input type="text" id="ko-category" name="ko-category" value="전채요리">

                                <label for="ar-category">ar</label>
                                <input type="text" id="ar-category" name="ar-category" value="المقبلات">

                                <div class="change-buttons">
                                    <button type="button" class="act-btn save-btn-category">Save</button>
                                    <button type="button" class="act-btn exit-btn-category">Exit</button>
                                </div>
                            </div>
                        </div>

                        <div class="category-block">
                            <div class="category-block-info">
                                <div class="category-name" id="meat-seafood">Meat & Seafood</div>
                                <img src="../../images/edit-btn.svg" alt="" class="edit-btn edit-btn-category">
                            </div>
                            <div class="category-block-edit">
                                <label for="en-category">en</label>
                                <input type="text" id="en-category" name="en-category" value="Meat & Seafood">

                                <label for="ru-category">ru</label>
                                <input type="text" id="ru-category" name="ru-category" value="Мясо и морепродукты">

                                <label for="ko-category">ko</label>
                                <input type="text" id="ko-category" name="ko-category" value="고기 & 해산물">

                                <label for="ar-category">ar</label>
                                <input type="text" id="ar-category" name="ar-category"
                                    value="اللحوم والمأكولات البحرية">

                                <div class="change-buttons">
                                    <button type="button" class="act-btn save-btn-category">Save</button>
                                    <button type="button" class="act-btn exit-btn-category">Exit</button>
                                </div>
                            </div>
                        </div>

                        <div class="add-category-container">
                            <div class="add-category-btn active">Add category</div>

                            <div class="add-category-block">
                                <div class="add-category-block-edit">
                                    <div class="category-name">New category</div>

                                    <label for="en-category">en</label>
                                    <input type="text" id="en-category" name="en-category">

                                    <label for="ru-category">ru</label>
                                    <input type="text" id="ru-category" name="ru-category">

                                    <label for="ko-category">ko</label>
                                    <input type="text" id="ko-category" name="ko-category">

                                    <label for="ar-category">ar</label>
                                    <input type="text" id="ar-category" name="ar-category">

                                    <div class="change-buttons">
                                        <button type="button" class="act-btn add-btn-category">Add</button>
                                        <button type="button" class="act-btn cancel-btn-category">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="items-main-container">
                    <div class="subtitle">Items</div>

                    <div class="items-wrapper">
                        <div class="item-block">
                            <div class="item-name">Kimbab</div>
                        </div>
                        <div class="item-block">
                            <div class="item-name">Goonmandoo</div>
                        </div>
                        <div class="item-block">
                            <div class="item-name">Gaelanmari</div>
                        </div>


                        <div class="add-item-btn">Add item</div>
                    </div>
                </div>


            </div>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
