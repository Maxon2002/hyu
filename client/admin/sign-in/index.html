<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sign in</title>

    <link rel="icon" href="../images/Hyu-favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="../images/Hyu-favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="wrapper">
        


        <div class="main-container">
            <div class="main-title">Admin Sign in</div>
            <div class="form-box">
                <form class="auth-form">
                    <div class="wrong-data hidden">Invalid login or password.</div>
                    <label for="login">Login</label>
                    <input type="text" id="login" name="login" placeholder="Enter login" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </form>
                <div class="form-buttons">
                    <div class="form-button-main">Sign in</div>
                </div>
            </div>
        </div>


    
    </div>

    <script src="script.js"></script>

</body>

</html>
