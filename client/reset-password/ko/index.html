<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-36BNKE66VZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-36BNKE66VZ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두바이 HYU 한식당 – 비밀번호 재설정</title>

    <link rel="icon" href="../../images/Hyu-favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="../../images/Hyu-favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <div class="header-wrapper">
                <div class="header-buttons">
                    <div class="header-button-menu"><a href="../../menu/ko/">메뉴 보기</a></div>
                    <div class="header-button-book"><a href="../../reservation/ko/">예약하기</a></div>
                </div>
                <a href="../../ko/" class="header-logo"><img src="../../images/Hyu Logo.svg" alt="logo"></a>
                <div class="header-language">
                    <div class="header-language-selected">한국어</div>
                    <img src="../../images/language-icon.svg" alt="language-icon" class="header-language-icon">
                </div>
            </div>

            <nav class="site-nav">
                <ul>
                    <li class="nav-list" id="en"><a href="../">English</a></li>
                    <li class="nav-list active" id="ko">한국어</li>
                    <li class="nav-list" id="ru"><a href="../ru/">Русский</a></li>
                    <li class="nav-list" id="ar"><a href="../ar/">العربية</a></li>
                </ul>
            </nav>
        </header>

        <div class="site-nav-back hidden"></div>


        <div class="main-container">
            <div class="main-title">비밀번호 재설정</div>
            <div class="form-box">
                <form class="auth-form">

                    <label for="password">새 비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="새 비밀번호" required>

                    <div class="wrong-password hidden">비밀번호는 최소 8자 이상이어야 하며, 숫자 1개 이상을 포함해야 합니다</div>
                    <div class="error-message hidden">토큰이 유효하지 않거나 만료되었습니다.</div>
                    <div class="success-message hidden">비밀번호가 성공적으로 재설정되었습니다!</div>
                </form>
                <div class="form-buttons">
                    <div class="form-button-main">비밀번호 재설정</div>
                    <div class="form-button-question"><a href="../sign-in/ko/">로그인으로 돌아가기</a></div>
                </div>
            </div>
        </div>


        <footer class="footer">
            <div class="footer-wrapper">
                <div class="info-block">
                    <img src="../../images/Hyu Logo.svg" alt="logo" class="footer-logo">
                    <div class="contact-info">
                        <div class="contact-info-block">
                            <img src="../../images/email-icon-light.svg" alt="email">
                            <div>hyurestaurant@gmail.com</div>
                        </div>
                        <div class="contact-info-block">
                            <img src="../../images/phone-icon-light.svg" alt="phone">
                            <div>+971 502 273 004</div>
                        </div>
                    </div>
                </div>
                <div class="social-media-block">
                    <a href="https://www.facebook.com/hyurestaurant" target="_blank" rel="noopener noreferrer">
                        <img src="../../images/facebook.svg" alt="facebook">
                    </a>
                    <a href="https://www.instagram.com/hyurestaurant" target="_blank" rel="noopener noreferrer">
                        <img src="../../images/instagram.svg" alt="instagram">
                    </a>
                </div>

                <div class="timing-block">
                    <div>매일 기다리고 있습니다</div>
                    <div>영업 시간: 11:00 ~ 23:30</div>
                </div>
                <div class="terms-block">
                    <a href="../../privacy-policy/ko/">개인정보 처리방침</a>
                    <a href="../../terms-and-conditions/ko/">이용 약관</a>
                </div>
            </div>
        </footer>
    </div>

    <script src="../script.js"></script>

</body>

</html>
